name: Windows build and icon regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application through local build script
        if: matrix.configuration == 'Release'
        shell: cmd
        run: build.bat
      - name: Build and run regression executable
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild WeekNumberLite.csproj -t:Rebuild "-p:Configuration=$env:CONFIGURATION" -nologo -v:minimal -bl:application.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild tests/IconTests.csproj -t:Rebuild "-p:Configuration=$env:CONFIGURATION" -nologo -v:minimal -bl:tests.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\tests\bin\$env:CONFIGURATION\IconTests.exe" artifacts/icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload executable, render sheets and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/${{ matrix.configuration }}/
            artifacts/icons/
            *.binlog
